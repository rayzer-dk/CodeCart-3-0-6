name: CodeCart full build and chat changes
on:
  push:
    paths:
      - '.github/workflows/chat-complete-build-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate current source
        shell: bash
        run: |
          set -euo pipefail
          php -l upload/admin/controller/tool/scheduler.php
          php -l upload/system/library/codecart/src/SystemNotification.php
          php -l upload/admin/controller/tool/log.php
          php -l upload/admin/model/sale/abandoned_cart.php
          php -l upload/admin/controller/sale/abandoned_cart.php
          php -l upload/admin/controller/catalog/product.php
          php -l upload/admin/model/catalog/product.php
          for lang in en-gb ru-ru uk-ua; do
            php -l "upload/admin/language/$lang/tool/diagnostics.php"
            php -l "upload/admin/language/$lang/tool/scheduler.php"
          done
          node --check upload/admin/view/javascript/codecart-quick-price-edit.js
          node --check upload/admin/view/javascript/codecart-scheduler.js
          php tools/qa_notification_diagnostics.php
          php -r 'class Controller { public $language; } class Lang { public function get($k) { return $k === "text_diag_technical_details" ? "Technical details: %s" : $k; }} require "upload/admin/controller/tool/scheduler.php"; $o = new ControllerToolScheduler(); $o->language = new Lang(); $m = new ReflectionMethod($o, "safeDiagnostic"); $m->setAccessible(true); if ($m->invoke($o, "Missing old diagnostic method") !== "Technical details: Missing old diagnostic method") { exit(1); } echo "PASS stale SystemNotification compatibility\n";'
          python3 - <<'PY'
          from pathlib import Path
          twig=Path('upload/admin/view/template/catalog/product_list.twig').read_text()
          js=Path('upload/admin/view/javascript/codecart-quick-price-edit.js').read_text()
          css=Path('upload/admin/view/stylesheet/codecart_product_list.css').read_text()
          log=Path('upload/admin/view/template/tool/log.twig').read_text()
          sc=Path('upload/admin/controller/tool/scheduler.php').read_text()
          cart=Path('upload/admin/model/sale/abandoned_cart.php').read_text()
          assert 'codecart-quick-price-edit.js?v=3.0.6.8' in twig
          assert 'codecart_product_list.css?v=3.0.6.12' in twig
          assert 'ccp-qpe-inline-editor' in js and 'ccp-qpe-popover' not in js
          assert 'ccp-qpe-inline-editor' in css and 'position: absolute !important' in css
          assert '.cc-log-toolbar .cc-log-action' in log
          assert '.cc-log-toolbar .cc-log-copy' in log
          assert 'background:#ffd263' in log
          assert 'private function safeDiagnostic(' in sc
          assert 'is_callable(' in sc
          assert 'min(30,' in cart
          print('PASS UI, asset cache, 30-day carts and safe scheduler error handling')
          PY
      - name: Build both archives from the same main commit
        shell: bash
        run: |
          set -euo pipefail
          base=e754929118ddf7e7e6c8df4f43e0e0b38e79d54b
          git fetch --no-tags --depth=1 origin "$base"
          git archive --format=zip --output=CodeCart_3.0.6_Full_Main_20261026.zip HEAD
          python3 - <<'PY'
          import hashlib, subprocess, zipfile
          from pathlib import Path
          base='e754929118ddf7e7e6c8df4f43e0e0b38e79d54b'
          changed=subprocess.check_output(['git','diff','--name-only','--diff-filter=ACMR','-z',base,'HEAD']).split(b'\0')
          changed=[p.decode('utf-8') for p in changed if p]
          assert len(changed)>=49, f'Only {len(changed)} changed paths found'
          readme='''CodeCart 3.0.6 - all files changed since the start of this chat.
          Source: the main branch at the same revision as the complete ZIP.
          Before updating, back up the full website and database.
          Files under upload/ replace their matching OpenCart/CodeCart paths.
          .github/workflows/ and tools/ are source/developer checks, not site files.

          Scheduler 500 safety: the controller now tolerates an older
          SystemNotification during partial updates and logs the original failure.
          Deploy the matching upload/system/library/codecart/src/SystemNotification.php
          as well as upload/admin/controller/tool/scheduler.php, then refresh PHP
          OPcache. The previous missing method caused HTTP 500.

          The product price/quantity edit now happens inside the selected cell.
          Refresh OCMOD, Twig and browser cached assets after updating.
          Log header buttons are equal 38x38; Copy has a yellow background.
          Abandoned cart retention supports up to 30 days.

          Historic SEOPRO and EU Cookie Consent module warnings in the supplied
          application log are separate faults and are not fixed by this update.
          '''
          patch='CodeCart_3.0.6_All_Changes_This_Chat_20261026.zip'
          with zipfile.ZipFile(patch,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=7) as z:
              for name in changed:
                  assert Path(name).is_file(),name
                  z.write(name,arcname=name)
              z.writestr('README-CHAT-CHANGES.txt',readme)
          full='CodeCart_3.0.6_Full_Main_20261026.zip'
          with zipfile.ZipFile(full) as f,zipfile.ZipFile(patch) as p:
              assert f.testzip() is None
              assert p.testzip() is None
              for name in changed:
                  assert name in f.namelist()
                  assert hashlib.sha256(f.read(name)).digest()==hashlib.sha256(p.read(name)).digest(),name
              for required in ('upload/index.php','upload/admin/index.php','upload/system/framework.php'):
                  assert required in f.namelist()
              print('PATCH FILES:',len(changed))
              print('COMPLETE FILES:',len(f.namelist()))
              print('VERIFIED identical contents of all changed files.')
          PY
          sha256sum CodeCart_3.0.6_Full_Main_20261026.zip CodeCart_3.0.6_All_Changes_This_Chat_20261026.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodeCart_3.0.6_Full_Main_20261026
          path: CodeCart_3.0.6_Full_Main_20261026.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: CodeCart_3.0.6_All_Changes_This_Chat_20261026
          path: CodeCart_3.0.6_All_Changes_This_Chat_20261026.zip
          if-no-files-found: error
          retention-days: 30
