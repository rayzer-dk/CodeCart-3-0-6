name: CodeCart source integrity (UTF-8, safe Unicode)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Verify regression fixtures
        run: php tools/quality/source_guard_test.php
      - name: Schema.org JSON-LD regression
        run: php tools/structured-data-check.php
      - name: Search matching and SQL regression
        run: |
          php tests/smart_search_smoke.php
          php tests/smart_search_sql_smoke.php
          php tests/smart_search_index_smoke.php
          php tests/catalog_quality_smoke.php
          php tests/blog_landing_locale_smoke.php
          php tests/product_condition_smoke.php
      - name: Audit all changed tracked source files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base=HEAD^
          else
            echo "First commit: no diff base"
            exit 0
          fi
          mapfile -d '' -t candidates < <(git diff --name-only -z --diff-filter=ACM "$base" HEAD)
          sources=()
          for file in "${candidates[@]}"; do
            case "$file" in
              vendor/*|node_modules/*|var/*|public/build/*|upload/system/storage/vendor/*|upload/system/storage/cache/*|upload/system/storage/logs/*|upload/system/storage/modification/*|tools/quality/vendor/*|build/*)
                continue ;;
              *.php|*.js|*.jsx|*.ts|*.tsx|*.css|*.scss|*.twig|*.html|*.xml|*.svg|*.json|*.yml|*.yaml|*.sh|*.py|*.neon|*.sql|*.md)
                sources+=("$file") ;;
            esac
          done
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No changed source files"
            exit 0
          fi
          php tools/quality/source_guard.php --check "${sources[@]}"
          for file in "${sources[@]}"; do
            if [[ "$file" == *.php ]]; then php -l "$file"; fi
          done

      - name: Full source integrity audit (blocking)
        shell: bash
        run: |
          set +e
          php tools/quality/source_guard.php --check upload/admin upload/catalog upload/system tools > /tmp/quality-full-audit.log 2>&1
          status=$?
          set -e
          echo "Full legacy source audit exit status: $status"
          echo "Reported findings: $(grep -c '^SOURCE GUARD:' /tmp/quality-full-audit.log || true)"
          sed -n '1,45p' /tmp/quality-full-audit.log
          echo "Findings grouped by file:"
          grep '^SOURCE GUARD:' /tmp/quality-full-audit.log | sed -E 's/:[0-9]+:.*$//' | sort | uniq -c | sort -nr | head -n 60 || true
          if [ "$status" -ne 0 ]; then
            echo "Full source integrity audit failed"
            exit "$status"
          fi
          echo "Full source integrity audit: CLEAN"

  search-compat:
    name: Search compatibility PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.1', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli
          coverage: none
      - name: Search syntax and regression
        run: |
          php -l upload/system/library/codecart/src/SmartSearch.php
          php -l upload/system/library/codecart/src/SearchIndex.php
          php -l upload/system/library/codecart/src/CatalogQuality.php
          php -l upload/system/library/codecart/src/BlogLocaleSeo.php
          php -l upload/system/library/codecart/src/ProductCondition.php
          php -l upload/system/library/codecart/migration.php
          php -l upload/admin/model/catalog/product.php
          php -l upload/catalog/controller/extension/feed/google_base.php
          php -l upload/admin/controller/blog/setting.php
          php -l upload/catalog/controller/blog/latest.php
          php -l upload/catalog/controller/blog/menu.php
          php -l upload/catalog/model/catalog/product.php
          php -l upload/admin/model/catalog/product.php
          php -l upload/admin/controller/catalog/search_query.php
          php tests/smart_search_smoke.php
          php tests/smart_search_sql_smoke.php
          php tests/smart_search_index_smoke.php
          php tests/catalog_quality_smoke.php
          php tests/blog_landing_locale_smoke.php
          php tests/product_condition_smoke.php
