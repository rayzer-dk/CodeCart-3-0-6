name: Newsletter and Document QA
on:
  push:
    branches: [main]
    paths:
      - 'upload/system/library/codecart/src/NewsletterEmail.php'
      - 'upload/admin/controller/marketing/contact.php'
      - 'upload/admin/view/template/marketing/contact.twig'
      - 'upload/admin/language/*/marketing/contact.php'
      - 'upload/catalog/controller/cron/mail_campaign.php'
      - 'upload/admin/view/stylesheet/codecart_documents.css'
      - 'upload/admin/view/template/catalog/download_*.twig'
      - 'upload/admin/view/template/catalog/public_document_*.twig'
      - 'tests/newsletter_documents_smoke.php'
      - '.github/workflows/newsletter-document-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mail-and-documents:
    name: PHP ${{ matrix.php }} smoke tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4','8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: Lint new PHP paths
        shell: bash
        run: |
          set -euo pipefail
          php -l upload/system/library/codecart/src/NewsletterEmail.php
          php -l upload/admin/controller/marketing/contact.php
          php -l upload/catalog/controller/cron/mail_campaign.php
          for lang in en-gb ru-ru uk-ua; do
            php -l "upload/admin/language/$lang/marketing/contact.php"
          done
          php -l tests/newsletter_documents_smoke.php
      - name: Run newsletter and document smoke tests
        run: php tests/newsletter_documents_smoke.php
