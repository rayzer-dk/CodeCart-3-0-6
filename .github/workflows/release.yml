name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: codecart-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, openssl, zip, xml, simplexml, xmlreader, mysqli, pdo_mysql, gd
          coverage: none
          tools: composer:v2

      - name: Validate tag and build metadata
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          BUILD="$(php -r '$c=file_get_contents("upload/index.php"); if(!preg_match("/CODECART_PACKAGE_BUILD[^0-9]+([0-9]+\\.[0-9]+\\.[0-9]+)/",$c,$m)){exit(2);} echo $m[1];')"
          echo "Tag:   $TAG"
          echo "Build: $BUILD"
          test "$TAG" = "$BUILD"

      - name: Install locked production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Release gate
        run: php tools/release_check.php

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          NAME="CodeCart_PRO_3.0.6.0_Build_${GITHUB_REF_NAME#v}.zip"
          items=(upload documentation tools composer.json composer.lock)
          [ -f README_FIRST.txt ] && items+=(README_FIRST.txt)
          [ -f README.md ] && items+=(README.md)
          [ -f CHANGELOG.md ] && items+=(CHANGELOG.md)
          [ -f THIRD_PARTY_DEPENDENCIES.json ] && items+=(THIRD_PARTY_DEPENDENCIES.json)
          zip -qr "artifacts/$NAME" "${items[@]}"
          sha256sum "artifacts/$NAME" > artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME"             artifacts/*.zip artifacts/SHA256SUMS.txt             --verify-tag             --generate-notes             --title "CodeCart $GITHUB_REF_NAME"
