name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: codecart-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require release commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, openssl, zip, xml, simplexml, xmlreader, mysqli, pdo_mysql, gd
          coverage: none
          tools: composer:v2

      - name: Validate tag and build metadata
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          BUILD="$(php -r '$c=file_get_contents("upload/index.php"); if(!preg_match("/CODECART_PACKAGE_BUILD[^0-9]+([0-9]+\\.[0-9]+\\.[0-9]+)/",$c,$m)){exit(2);} echo $m[1];')"
          echo "Tag:   $TAG"
          echo "Build: $BUILD"
          test "$TAG" = "$BUILD"

      - name: Install locked production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Release gate
        run: php tools/release_check.php

      - name: Build optional bonus extensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bonuses
          if [ -d bonus-source/monobank_payment ]; then
            python3 tools/package_unishop2_bonus.py --module monobank_payment --output bonuses
            test -f bonuses/Monobank_Payment_Modern_Pro_v1.1.1.ocmod.zip
          fi
          test -f bonus-source/unishop2_compatibility/install.xml
          python3 tools/package_unishop2_bonus.py --output bonuses
          test -f bonuses/UniShop2_Compatibility_Pro_v1.0.2.ocmod.zip

      - name: Verify current bundled documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_documentation.py --output "$RUNNER_TEMP/CodeCart_PRO_Documentation.zip"
          cmp upload/admin/view/documentation/CodeCart_PRO_Documentation.zip "$RUNNER_TEMP/CodeCart_PRO_Documentation.zip"

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/package_production.py --output artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME"             artifacts/*.zip artifacts/*.zip.sha256             --verify-tag             --generate-notes             --title "CodeCart $GITHUB_REF_NAME"
