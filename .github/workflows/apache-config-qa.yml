name: Apache Configuration QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Apache
        run: sudo apt-get update -qq && sudo apt-get install -y apache2
      - name: Validate security, ACME and routing
        run: python3 tools/qa_apache_config.py
