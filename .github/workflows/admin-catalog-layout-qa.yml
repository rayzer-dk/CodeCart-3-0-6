name: Admin Catalog Layout and Category Images QA

on:
  push:
    branches: [main]
    paths:
      - 'upload/admin/view/template/catalog/*_list.twig'
      - 'upload/admin/view/template/blog/*_list.twig'
      - 'upload/admin/view/javascript/codecart/catalog-quality.js'
      - 'upload/admin/view/stylesheet/codecart-catalog-quality.css'
      - 'upload/admin/controller/catalog/category.php'
      - 'upload/catalog/view/theme/*/template/product/category.twig'
      - 'tools/restore_ocstore_demo_category_photos.php'
      - 'tests/catalog_quality_smoke.php'
      - 'tests/admin_layout_demo_images_smoke.php'
      - '.github/workflows/admin-catalog-layout-qa.yml'
  pull_request:
    paths:
      - 'upload/admin/view/template/catalog/*_list.twig'
      - 'upload/admin/view/template/blog/*_list.twig'
      - 'upload/admin/view/javascript/codecart/catalog-quality.js'
      - 'upload/admin/view/stylesheet/codecart-catalog-quality.css'
      - 'upload/admin/controller/catalog/category.php'
      - 'tools/restore_ocstore_demo_category_photos.php'
      - 'tests/catalog_quality_smoke.php'
      - 'tests/admin_layout_demo_images_smoke.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-layout:
    name: Admin layout / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l upload/admin/controller/catalog/category.php
          php -l tools/restore_ocstore_demo_category_photos.php
          php -l tests/admin_layout_demo_images_smoke.php
          php -l tests/catalog_quality_smoke.php
      - name: Static layout, images and quality regressions
        run: |
          php tests/admin_layout_demo_images_smoke.php
          php tests/catalog_quality_smoke.php
