name: CodeCart dead-code audit

on:
  push:
    branches: [main]
    paths:
      - 'upload/**/*.php'
      - 'tools/quality/**'
      - 'phpstan.codecart.*.neon.dist'
      - '.github/workflows/dead-code-audit.yml'
  pull_request:
    paths:
      - 'upload/**/*.php'
      - 'tools/quality/**'
      - 'phpstan.codecart.*.neon.dist'
      - '.github/workflows/dead-code-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dead-code-codecart-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dead-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,dom,xml,tokenizer,zip
          coverage: none
          tools: composer:v2
      - name: Install isolated PHPStan tooling
        run: composer install --working-dir=tools/quality --no-interaction --prefer-dist --no-progress
      - name: Install locked runtime dependencies for type discovery
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Build OpenCart admin and catalog model stubs
        run: |
          set -euo pipefail
          php tools/quality/generate_phpstan_models.php catalog
          php tools/quality/generate_phpstan_models.php admin
          php -l build/phpstan-stubs/catalog.stub
          php -l build/phpstan-stubs/admin.stub
      - name: Prove unused-variable and private-member rules detect regressions
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/quality/fixtures/dead_code_valid.php
          php -l tools/quality/fixtures/dead_code_invalid.php
          mkdir -p build/phpstan-reports
          tools/quality/vendor/bin/phpstan analyse \
            -c phpstan.codecart.catalog.dead-code.neon.dist \
            tools/quality/fixtures/dead_code_valid.php \
            --no-progress --memory-limit=2G --error-format=raw
          if tools/quality/vendor/bin/phpstan analyse \
            -c phpstan.codecart.catalog.dead-code.neon.dist \
            tools/quality/fixtures/dead_code_invalid.php \
            --no-progress --memory-limit=2G --error-format=raw \
            > build/phpstan-reports/fixture.txt 2>&1; then
            echo '::error::Known dead code was not detected'
            exit 1
          fi
          for symbol in forgotten unusedProperty unusedMethod; do
            if ! grep -Fq "$symbol" build/phpstan-reports/fixture.txt; then
              cat build/phpstan-reports/fixture.txt
              echo "::error::Rule did not detect $symbol"
              exit 1
            fi
          done
          echo 'Verified: unused local variable, private property, private method'
      - name: Inspect first-party controllers and models (advisory)
        shell: bash
        run: |
          set -euo pipefail
          printf '### PHPStan dead-code inventory (advisory)\n\n' >> "$GITHUB_STEP_SUMMARY"
          for app in catalog admin; do
            set +e
            tools/quality/vendor/bin/phpstan analyse \
              -c "phpstan.codecart.${app}.dead-code.neon.dist" \
              --no-progress --memory-limit=2G --error-format=raw \
              > "build/phpstan-reports/${app}.txt" 2>&1
            status=$?
            set -e
            printf -- '- %s: exit code %s; full diagnostic in artifact.\n' "$app" "$status" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,60p' "build/phpstan-reports/${app}.txt"
          done
          echo 'The inventory is advisory until legacy findings are triaged. Existing PHPStan CI remains blocking.'
      - name: Upload dead-code findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecart-dead-code-findings
          path: build/phpstan-reports/
          if-no-files-found: ignore
          retention-days: 14
