name: Category Tree and Localized Values QA

on:
  push:
    branches: [main]
    paths:
      - 'upload/admin/controller/catalog/category.php'
      - 'upload/admin/controller/blog/category.php'
      - 'upload/admin/controller/blog/article.php'
      - 'upload/admin/controller/sale/order.php'
      - 'upload/admin/model/sale/order.php'
      - 'upload/admin/model/catalog/product.php'
      - 'upload/admin/controller/catalog/product.php'
      - 'upload/catalog/model/catalog/product.php'
      - 'upload/admin/view/template/catalog/category_list.twig'
      - 'upload/admin/view/template/blog/category_list.twig'
      - 'upload/admin/view/template/blog/article_list.twig'
      - 'upload/admin/view/template/sale/order_list.twig'
      - 'upload/admin/view/template/catalog/product_form.twig'
      - 'upload/admin/view/javascript/codecart/category-tree.js'
      - 'upload/admin/view/stylesheet/codecart-category-tree.css'
      - 'upload/system/library/codecart/src/AdminCategoryTreeEditor.php'
      - 'upload/system/library/codecart/migration.php'
      - 'upload/install/opencart.sql'
      - 'tests/admin_category_tree_smoke.php'
      - 'tests/product_option_localization_smoke.php'
      - '.github/workflows/category-tree-localized-values-qa.yml'
  pull_request:
    paths:
      - 'upload/admin/view/template/**'
      - 'upload/admin/controller/catalog/category.php'
      - 'upload/admin/controller/blog/**'
      - 'upload/system/library/codecart/src/AdminCategoryTreeEditor.php'
      - 'tests/admin_category_tree_smoke.php'
      - 'tests/product_option_localization_smoke.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  category-tree:
    name: Tree, images and locales / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            upload/admin/controller/catalog/category.php \
            upload/admin/controller/blog/category.php \
            upload/admin/controller/blog/article.php \
            upload/admin/controller/sale/order.php \
            upload/admin/model/sale/order.php \
            upload/admin/model/catalog/product.php \
            upload/admin/controller/catalog/product.php \
            upload/catalog/model/catalog/product.php \
            upload/system/library/codecart/src/AdminCategoryTreeEditor.php \
            upload/system/library/codecart/migration.php \
            tests/admin_category_tree_smoke.php \
            tests/product_option_localization_smoke.php; do
            php -l "$file"
          done
      - name: JavaScript syntax
        run: node --check upload/admin/view/javascript/codecart/category-tree.js
      - name: Regression tests
        run: |
          php tests/admin_category_tree_smoke.php
          php tests/product_option_localization_smoke.php
          php tests/custom_field_translation_smoke.php
          php tests/admin_layout_demo_images_smoke.php
