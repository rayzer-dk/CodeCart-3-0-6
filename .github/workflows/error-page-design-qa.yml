name: CodeCart Error Page Design QA

on:
  push:
    branches: [main]
    paths:
      - 'upload/system/helper/error_page.php'
      - 'upload/catalog/controller/error/not_found.php'
      - 'upload/catalog/controller/common/maintenance.php'
      - 'upload/catalog/view/theme/*/template/error/not_found.twig'
      - 'upload/catalog/view/theme/*/template/common/maintenance.twig'
      - 'upload/catalog/view/theme/codecart/stylesheet/error-page.css'
      - 'upload/admin/controller/error/**'
      - 'upload/admin/view/template/error/**'
      - 'upload/admin/view/stylesheet/codecart-error-page.css'
      - 'upload/admin/language/*/error/**'
      - 'tools/qa_error_pages.php'
      - '.github/workflows/error-page-design-qa.yml'
  pull_request:
    paths:
      - 'upload/system/helper/error_page.php'
      - 'upload/catalog/controller/error/not_found.php'
      - 'upload/catalog/controller/common/maintenance.php'
      - 'upload/catalog/view/theme/*/template/error/not_found.twig'
      - 'upload/catalog/view/theme/*/template/common/maintenance.twig'
      - 'upload/catalog/view/theme/codecart/stylesheet/error-page.css'
      - 'upload/admin/controller/error/**'
      - 'upload/admin/view/template/error/**'
      - 'tools/qa_error_pages.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  error-experience:
    name: Error pages / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l upload/system/helper/error_page.php
          php -l upload/catalog/controller/error/not_found.php
          php -l upload/catalog/controller/common/maintenance.php
          php -l upload/admin/controller/error/not_found.php
          php -l upload/admin/controller/error/permission.php
          php -l tools/qa_error_pages.php
      - name: Error design and security smoke tests
        run: php tools/qa_error_pages.php
