name: CodeCart Twig template QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  twig:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,dom,xml,tokenizer,zip
          coverage: none
          tools: composer:v2
      - name: Verify Twig context audit fixtures
        run: python3 tools/quality/twig_context_audit.py --self-test
      - name: Controller and Twig context report
        run: python3 tools/quality/twig_context_audit.py --mode codecart --report build/twig-context-report.txt
      - name: Install locked Twig 3 runtime
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Twig syntax inventory
        run: |
          php -l tools/quality/twig_syntax_check.php
          php tools/quality/twig_syntax_check.php
      - name: Upload Twig findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecart-twig-qa
          path: |
            build/twig-context-report.txt
            build/twig-syntax-report.txt
          if-no-files-found: ignore
          retention-days: 14
