name: Cron Notifications Cart Deep QA

on:
  push:
    paths:
      - '.github/workflows/cron-notifications-cart-deep-qa.yml'
      - 'upload/system/library/codecart/src/Scheduler.php'
      - 'upload/system/library/codecart/src/SystemNotification.php'
      - 'upload/system/library/codecart/src/AbandonedCartReminder.php'
      - 'upload/admin/controller/tool/scheduler.php'
      - 'upload/admin/controller/tool/notification.php'
      - 'upload/admin/controller/sale/abandoned_cart.php'
      - 'upload/admin/model/sale/abandoned_cart.php'
      - 'upload/admin/view/stylesheet/codecart_scheduler.css'
      - 'upload/admin/view/stylesheet/codecart_abandoned_cart.css'
      - 'upload/admin/view/template/tool/scheduler.twig'
      - 'upload/admin/view/template/tool/notification.twig'
      - 'upload/admin/view/template/sale/abandoned_cart_list.twig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source snapshot for three-area review
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('upload')
          files = []
          directories = [
            root/'admin/controller/tool',
            root/'admin/controller/sale',
            root/'admin/model/sale',
            root/'admin/language/en-gb/tool',
            root/'admin/language/ru-ru/tool',
            root/'admin/language/uk-ua/tool',
            root/'admin/language/en-gb/sale',
            root/'admin/language/ru-ru/sale',
            root/'admin/language/uk-ua/sale',
            root/'admin/view/template/tool',
            root/'admin/view/template/sale',
            root/'admin/view/stylesheet',
            root/'admin/view/javascript',
            root/'catalog/controller/cron',
            root/'system/library/codecart/src',
            Path('tests'),
            Path('tools'),
            Path('documentation'),
          ]
          target_names = ('scheduler', 'notification', 'abandoned_cart', 'cart_reminder', 'cart_guest', 'consent', 'queue', 'cron', 'mail_campaign', 'stock_notify')
          for d in directories:
            for p in d.glob('*'):
              if p.is_file() and any(t in p.name.lower() for t in target_names): files.append(p)
          files.extend([
            root/'system/library/codecart/migration.php',
            root/'system/library/codecart/src/RegisteredCartConsent.php',
            root/'system/library/codecart/src/AbandonedCartReminder.php',
            root/'system/library/codecart/src/Queue.php',
            root/'system/library/codecart/src/MailDelivery.php',
            root/'system/library/codecart/src/SystemNotification.php',
            root/'system/library/codecart/src/Scheduler.php',
            root/'admin/view/template/tool/scheduler.twig',
            root/'admin/view/template/tool/notification.twig',
            root/'admin/view/template/sale/abandoned_cart_list.twig',
            root/'admin/view/stylesheet/codecart_scheduler.css',
            root/'admin/view/stylesheet/codecart_abandoned_cart.css',
            root/'admin/view/javascript/codecart-scheduler.js',
            root/'system/engine/action.php',
            root/'system/engine/loader.php',
            root/'system/framework.php',
            root/'cron.php',
            root/'cli.php',
          ])
          files = sorted(set(p for p in files if p.is_file()))
          with ZipFile('three-area-audit-source.zip', 'w', ZIP_DEFLATED, compresslevel=6) as z:
            for p in files: z.write(p, str(p))
          print('Included', len(files), 'sources.')
          PY
      - name: Validate PHP, JS and core smoke tests
        shell: bash
        run: |
          set -e
          for php_file in upload/system/library/codecart/src/{Scheduler,SystemNotification,AbandonedCartReminder,RegisteredCartConsent}.php upload/admin/controller/tool/{scheduler,notification}.php upload/admin/controller/sale/abandoned_cart.php; do php -l "$php_file"; done
          node --check upload/admin/view/javascript/codecart-scheduler.js
          php tests/scheduler_runtime_smoke.php
          php tests/cart_reminder_consent_multistore_smoke.php
          php tools/qa_notification_diagnostics.php
      - name: Verify CSS invariants and source-of-truth loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('upload/admin/view/stylesheet/codecart_scheduler.css').read_text()
          c = Path('upload/admin/view/stylesheet/codecart_abandoned_cart.css').read_text()
          template = Path('upload/admin/view/template/tool/scheduler.twig').read_text()
          controller = Path('upload/admin/controller/tool/scheduler.php').read_text()
          assert '<style>' not in template and '<link rel="stylesheet"' not in template
          assert "document->addStyle('view/stylesheet/codecart_scheduler.css?v=3.0.6.7')" in controller
          assert len(re.findall(r'\.codecart-scheduler-table \.ccp-scheduler-action-group \.btn\s*\{',s)) == 1
          assert 'flex: 0 0 29px' in s and 'flex: 0 0 36px' not in s
          widths = re.findall(r'\.ccp-carts-page \.ccp-abandoned-cart-table\{[^}]*min-width:(\d+)px', c)
          assert widths == ['1320'], widths  # Current wide admin table with explicit customer/contact/product columns
          for prefix in ('.ccp-external-advanced',):
            assert not re.search(r'^' + re.escape(prefix), c, re.M)
          assert 'border-top:3px solid #0057d9' in s
          assert 'border-top:3px solid #0057d9' in c
          print('PASS: one consistent source for Cron and Cart styling.')
          PY
      - name: Package tested replacement files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          paths = [
            'upload/admin/controller/tool/scheduler.php',
            'upload/admin/view/template/tool/scheduler.twig',
            'upload/admin/view/stylesheet/codecart_scheduler.css',
            'upload/admin/view/stylesheet/codecart_abandoned_cart.css',
          ]
          with ZipFile('CodeCart_3_0_6_Scheduler_Cart_CSS_Refactor.zip','w',ZIP_DEFLATED,compresslevel=9) as z:
            for p in paths: z.write(p)
            z.writestr('README.txt','CodeCart 3.0.6 – Cron and Cart UI fixes.\\nBack up website files and the database before replacing files.\\nCopy the full upload/ paths to the store root.\\nClear caches / OPcache as applicable.\\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cron-Notifications-Cart-Audit-Source
          path: three-area-audit-source.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: CodeCart-Cron-Cart-Styles-Replacement
          path: CodeCart_3_0_6_Scheduler_Cart_CSS_Refactor.zip
          retention-days: 14
