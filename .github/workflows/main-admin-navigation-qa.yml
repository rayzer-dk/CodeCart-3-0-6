name: CodeCart main admin navigation regression
on:
  push:
    branches: [main]
    paths:
      - 'upload/admin/view/template/common/column_left.twig'
      - 'upload/admin/view/javascript/codecart-header-overflow.js'
      - 'upload/admin/view/stylesheet/stylesheet.css'
      - 'tests/ui/main-admin-navigation-smoke.cjs'
      - 'tests/ui/main-admin-static-check.cjs'
      - 'upload/admin/view/stylesheet/codecart-main-ui.css'
      - 'upload/admin/view/template/**'
      - '.github/workflows/main-admin-navigation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    name: Bootstrap 3 admin sidebar and mobile header
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --package-lock=false
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax and UI contract
        run: |
          node --check upload/admin/view/javascript/codecart-header-overflow.js
          node --check tests/ui/main-admin-navigation-smoke.cjs
          node --check tests/ui/main-admin-static-check.cjs
          node tests/ui/main-admin-static-check.cjs
      - name: Run real Bootstrap 3 browser fixture
        run: node tests/ui/main-admin-navigation-smoke.cjs
