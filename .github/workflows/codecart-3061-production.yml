name: CodeCart PRO 3.0.6.1 production package
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/codecart-3061-production.yml'
      - 'tools/qa_error_pages.php'
      - 'upload/system/helper/error_page.php'
      - 'tools/package_production.py'
permissions:
  contents: write
concurrency:
  group: codecart-3061-production
  cancel-in-progress: true
jobs:
  production-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, openssl, zip, xml, simplexml, xmlreader, mysqli, pdo_mysql, gd
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked production PHP libraries
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Install isolated font build dependencies
        run: python -m pip install 'fonttools[woff]>=4.55,<5' brotli
      - name: Build Font Awesome Free 7.3.1 lightweight Core
        run: python tools/build_fontawesome_core.py
      - name: Rebuild first-party minified CSS and JavaScript
        run: bash tools/build_theme_css.sh
      - name: Build derived documentation and Workbox bundle
        run: |
          python tools/package_documentation.py
          node tools/vendor_workbox.mjs
      - name: Refresh release integrity for CodeCart PRO 3.0.6.1
        run: php tools/refresh_integrity.php
      - name: Validate installer over HTTP
        shell: bash
        run: |
          php -S 127.0.0.1:8765 -t upload >/tmp/cc-installer.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8765/install/index.php -o /tmp/cc-installer.html && break
            sleep 1
          done
          test -s /tmp/cc-installer.html || { cat /tmp/cc-installer.log; exit 1; }
          grep -qE '<html|<!DOCTYPE html' /tmp/cc-installer.html
          php tools/qa_error_pages.php
      - name: Run production release gate
        run: php tools/release_check.php
      - name: Commit versioned generated Core assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/catalog/view/javascript/font-awesome/css/font-awesome-core.min.css
          git add upload/catalog/view/javascript/font-awesome/webfonts/fa-*-core.woff2
          git add upload/system/config/codecart_fontawesome_core_manifest.json
          git add upload/admin/view/stylesheet/stylesheet.min.css
          git add upload/catalog/view/theme/codecart/stylesheet/stylesheet.min.css
          git add upload/catalog/view/theme/default/stylesheet/stylesheet.min.css
          git add upload/admin/view/javascript/common.min.js upload/catalog/view/javascript/common.min.js
          git add upload/system/config/codecart_integrity.json
          git add -u upload/admin/view/documentation upload/catalog/view/javascript/codecart/workbox || true
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize CodeCart 3.0.6.1 generated assets and integrity manifest'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Package full installable archive including Composer dependencies
        run: |
          mkdir -p artifacts
          python tools/package_production.py --output artifacts
          sha256sum artifacts/*.zip
      - name: Upload verified production archive
        uses: actions/upload-artifact@v4
        with:
          name: CodeCart_PRO_3.0.6.1_full_installable
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
