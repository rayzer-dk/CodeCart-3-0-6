name: Public documentation neutrality

on:
  push:
    branches: [main]
    paths:
      - 'README*'
      - 'CHANGELOG.md'
      - 'documentation/**'
      - 'docs/**'
      - '.github/workflows/public-docs-neutrality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neutral-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Block theme/plugin advertisements and store-specific examples
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEi 'uni.?shop|langdir|ocfilter|barzus\.com\.ua|fermateh\.com\.ua|gontagro\.com\.ua|rayzer\.dk' -- README.md README.uk.md README_FIRST.txt CHANGELOG.md documentation docs; then
            echo "External theme/module or site-specific references must not appear in public documentation."
            exit 1
          fi
          echo "Public documentation is platform-neutral (CodeCart, OpenCart, ocStore)."
