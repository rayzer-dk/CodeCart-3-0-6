name: Production Release Check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-matrix:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, openssl, zip, xml, simplexml, xmlreader, mysqli, pdo_mysql, gd
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Release checks
        run: php tools/release_check.php

  package:
    name: Build one-upload package
    if: github.event_name != 'pull_request'
    needs: php-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, openssl, zip, xml, simplexml, xmlreader, mysqli, pdo_mysql, gd
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Release checks
        run: php tools/release_check.php

      - name: Build one-upload ZIP
        run: |
          mkdir -p artifacts
          zip -qr artifacts/CodeCart_PRO_3.0.6.0_PRODUCTION.zip upload install documentation tools README_FIRST.txt CHANGELOG.md composer.json composer.lock 2>/dev/null ||           zip -qr artifacts/CodeCart_PRO_3.0.6.0_PRODUCTION.zip upload install documentation tools README.md CHANGELOG.md composer.json composer.lock

      - name: Checksums
        run: sha256sum artifacts/*.zip | tee artifacts/SHA256SUMS.txt

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeCart-production
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
