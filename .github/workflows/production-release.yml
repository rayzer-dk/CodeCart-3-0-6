name: Production Release Check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-ready:
    name: Source tree present
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ -f upload/index.php ] && [ -f upload/admin/index.php ] && [ -f upload/system/startup.php ] && [ -f upload/install/opencart.sql ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "CodeCart source tree is present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CodeCart source tree has not been imported yet. Production checks are intentionally skipped."
          fi

  php-matrix:
    name: PHP ${{ matrix.php }}
    needs: source-ready
    if: needs.source-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, openssl, zip, xml, simplexml, xmlreader, mysqli, pdo_mysql, gd
          coverage: none
          tools: composer:v2

      - name: Validate Composer lock
        run: composer validate --strict

      - name: Install locked production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Release checks
        run: php tools/release_check.php

  package:
    name: Build one-upload package
    needs: [source-ready, php-matrix]
    if: github.event_name != 'pull_request' && needs.source-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, openssl, zip, xml, simplexml, xmlreader, mysqli, pdo_mysql, gd
          coverage: none
          tools: composer:v2

      - name: Install locked production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Release checks
        run: php tools/release_check.php

      - name: Build one-upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          items=(upload documentation tools composer.json composer.lock)
          [ -f README_FIRST.txt ] && items+=(README_FIRST.txt)
          [ -f README.md ] && items+=(README.md)
          [ -f CHANGELOG.md ] && items+=(CHANGELOG.md)
          [ -f THIRD_PARTY_DEPENDENCIES.json ] && items+=(THIRD_PARTY_DEPENDENCIES.json)
          zip -qr artifacts/CodeCart_PRO_3.0.6.0_PRODUCTION.zip "${items[@]}"

      - name: Checksums
        run: sha256sum artifacts/*.zip | tee artifacts/SHA256SUMS.txt

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeCart-production
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
