name: CodeCart Full Production (main)
on:
  push:
    branches: [main]
    paths:
      - 'upload/index.php'
      - 'upload/admin/index.php'
      - 'upload/admin/controller/catalog/category.php'
      - 'upload/admin/controller/blog/category.php'
      - 'upload/admin/view/javascript/codecart/category-tree.js'
      - 'upload/admin/view/template/catalog/category_list.twig'
      - 'upload/admin/view/template/blog/category_list.twig'
      - 'upload/admin/view/template/blog/article_list.twig'
      - 'upload/admin/view/template/common/header.twig'
      - 'upload/admin/view/stylesheet/codecart-main-ui.css'
      - 'upload/admin/view/stylesheet/stylesheet.css'
      - 'tests/admin_category_tree_smoke.php'
      - 'tests/catalog_quality_smoke.php'
      - 'upload/system/library/codecart/src/CatalogQuality.php'
      - 'upload/admin/view/image/logo.webp'
      - 'upload/install/view/image/logo.webp'
      - 'upload/catalog/view/theme/codecart/image/codecart-logo.webp'
      - 'upload/system/library/codecart/assets/default-logo.webp'
      - 'upload/system/library/codecart/src/CronExpression.php'
      - 'upload/system/library/codecart/src/SchedulerSchedule.php'
      - 'upload/system/library/codecart/src/Scheduler.php'
      - 'upload/system/library/codecart/src/OrderAdminSearch.php'
      - 'upload/system/library/codecart/migration.php'
      - 'upload/admin/controller/tool/scheduler.php'
      - 'upload/admin/view/template/tool/scheduler.twig'
      - 'upload/admin/view/javascript/codecart-scheduler.js'
      - 'upload/admin/language/**/tool/scheduler.php'
      - 'upload/admin/language/**/sale/order.php'
      - 'tests/order_admin_db_smoke.php'
      - 'tests/scheduler_schedule_smoke.php'
      - '.github/workflows/codecart-full-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codecart-full-production-main
  cancel-in-progress: false

jobs:
  full-build:
    name: Validated one-upload archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build the current main branch (not a stale queued revision)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, curl, openssl, zip, xml, simplexml, xmlreader, mysqli, pdo_mysql, gd
          tools: composer:v2

      - name: Install locked production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate minified CSS and JavaScript before release checks
        run: bash tools/build_theme_css.sh

      - name: Refresh and commit integrity hashes for the actual source
        shell: bash
        run: |
          set -euo pipefail
          php tools/refresh_integrity.php
          git add upload/system/config/codecart_integrity.json
          git add upload/admin/view/stylesheet/stylesheet.min.css
          git add upload/catalog/view/theme/codecart/stylesheet/stylesheet.min.css
          git add upload/catalog/view/theme/default/stylesheet/stylesheet.min.css
          git add upload/admin/view/javascript/common.min.js
          git add upload/catalog/view/javascript/common.min.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh audited Core integrity manifest [skip ci]"
            git push origin HEAD:main
          fi

      - name: Scheduler Cron and order filtering regressions
        shell: bash
        run: |
          set -euo pipefail
          php tests/scheduler_schedule_smoke.php
          php tests/scheduler_crud_smoke.php
          php tests/scheduler_runtime_smoke.php
          php tests/order_admin_smoke.php
          php tests/product_condition_smoke.php
          php tests/admin_category_tree_smoke.php
          node --check upload/admin/view/javascript/codecart/category-tree.js
          node --check upload/admin/view/javascript/codecart-admin-ui.js

      - name: Full release gate
        run: php tools/release_check.php

      - name: Additional newsletter and extension regressions
        shell: bash
        run: |
          set -euo pipefail
          php tests/newsletter_documents_smoke.php
          php tests/blog_extension_ui_smoke.php
          php tests/installer_utf8mb4_and_icon_smoke.php
          php tests/mail_audit_restore_smoke.php

      - name: Rebuild optional bonus modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bonuses
          if [ -d bonus-source/monobank_payment ]; then
            python3 tools/package_monobank_bonus.py --output bonuses
            test -f bonuses/Monobank_Payment_Modern_Pro_v1.1.1.ocmod.zip
          fi

      - name: Verify bundled documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_documentation.py
          python3 tools/check_documentation_archive.py

      - name: Create full production ZIP and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/package_production.py --output artifacts
          mapfile -t archives < <(find artifacts -maxdepth 1 -type f -name '*.zip' | sort)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          unzip -tq "$archive"
          test -s "$archive.sha256"
          build="$(sed -n "s/.*CODECART_PACKAGE_BUILD', '\\([0-9.]*\\)'.*/\\1/p" upload/index.php | head -1)"
          test -n "$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=v$build" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          (cd artifacts && sha256sum -c "$(basename "$archive.sha256")")

      - name: Publish immutable release tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_BUILD: ${{ steps.package.outputs.build }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse HEAD)"
          remote="$(git rev-parse origin/main)"
          if [ "$current" != "$remote" ]; then
            echo "Main moved during packaging; refusing stale release." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag already exists; refusing to overwrite a published version." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" "$RELEASE_ARCHIVE.manifest.json" \
            --target "$current" \
            --title "CodeCart PRO 3.0.6.1 — Build $RELEASE_BUILD" \
            --notes "Validated full production archive from main at commit $current. Includes SHA-256 checksum and per-file manifest." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: CodeCart-PRO-full-${{ steps.package.outputs.build }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
