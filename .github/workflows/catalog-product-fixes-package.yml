name: Catalog product fixes package

on:
  push:
    paths:
      - '.github/workflows/catalog-product-fixes-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify changed sources and package
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "upload/admin/controller/catalog/product.php"
            "upload/admin/model/catalog/product.php"
            "upload/admin/view/template/catalog/product_list.twig"
            "upload/admin/view/stylesheet/codecart_product_list.css"
            "upload/admin/controller/extension/theme/codecart.php"
            "upload/admin/view/template/extension/theme/codecart.twig"
            "upload/admin/language/en-gb/extension/theme/codecart.php"
            "upload/admin/language/ru-ru/extension/theme/codecart.php"
            "upload/admin/language/uk-ua/extension/theme/codecart.php"
            "upload/catalog/model/tool/image.php"
            "upload/catalog/controller/product/product.php"
            "upload/catalog/view/theme/codecart/template/product/product.twig"
            "upload/catalog/view/theme/codecart/stylesheet/stylesheet.css"
          )
          for file in "${files[@]}"; do test -f "$file"; done
          php -l upload/admin/controller/catalog/product.php
          php -l upload/admin/model/catalog/product.php
          php -l upload/admin/controller/extension/theme/codecart.php
          php -l upload/catalog/controller/product/product.php
          php -l upload/catalog/model/tool/image.php
          for lang in en-gb ru-ru uk-ua; do
            php -l "upload/admin/language/$lang/extension/theme/codecart.php"
          done
          python3 - <<'PY'
          from pathlib import Path
          controller = Path("upload/catalog/controller/product/product.php").read_text()
          model = Path("upload/catalog/model/tool/image.php").read_text()
          template = Path("upload/catalog/view/theme/codecart/template/product/product.twig").read_text()
          css = Path("upload/catalog/view/theme/codecart/stylesheet/stylesheet.css").read_text()
          settings = Path("upload/admin/controller/extension/theme/codecart.php").read_text()
          assert "=== 'native' ? 'native' : 'contain'" in controller
          assert "array('none', 'white', 'theme', 'dark')" in model
          assert "($context === 'gallery' && $name === 'background') ? 'none'" in settings
          assert "product_gallery_background|default('none')" in template
          assert "ccp-product-media--bg-none" in css
          assert "background: transparent !important" in css
          assert "background: #fff !important" in css
          assert "ccp-product-media--fit-frame" in css
          print("Gallery model, defaults, template and CSS checks: PASS")
          PY
          cat > README-CHANGESET.txt <<'README'
          CodeCart 3.0.6 — catalog SKU filter and product image/background controls.
          Archive contains 13 complete modified source files in upload/ layout.
          Make a FULL BACKUP of the store files and database before updating!
          Replace corresponding CodeCart 3.0.6 files; clear Twig cache and refresh OCMOD.
          Theme settings > Product images > Product photo display:
          Fit to frame without cropping is the default for NEW configurations. No pixels
          are added to the image and small photos can be proportionally enlarged.
          Standard OpenCart processing remains available as a legacy compatible option,
          which may add white padding inside a generated JPEG.
          Product gallery > Image area background: None (transparent) is the new
          gallery default; White, Theme or Dark color the frame only.
          Previously SAVED gallery mode/background settings stay unchanged.
          For an existing shop choose Fit to frame and None to remove new padding.
          A white or colored background that is already in the original JPEG/PNG
          cannot be removed with a CSS setting (requires image background removal).
          Product source files are never overwritten: derived images use cache.
          These settings affect CodeCart theme product detail gallery only; other
          installed OpenCart/ocStore themes keep their original behavior.
          The package uses files from the repository main branch at build time.
          README
          zip -q CodeCart_Catalog_Image_Background_2026-10-25.zip "${files[@]}" README-CHANGESET.txt
          unzip -t CodeCart_Catalog_Image_Background_2026-10-25.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodeCart_Catalog_Image_Background_2026-10-25
          path: CodeCart_Catalog_Image_Background_2026-10-25.zip
          if-no-files-found: error
          retention-days: 30
