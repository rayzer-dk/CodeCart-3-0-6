name: Catalog Product Corrections Package

on:
  push:
    paths:
      - '.github/workflows/catalog-product-fixes-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint changes and build the ZIP
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "upload/admin/controller/catalog/product.php"
            "upload/admin/model/catalog/product.php"
            "upload/admin/view/template/catalog/product_list.twig"
            "upload/admin/view/stylesheet/codecart_product_list.css"
            "upload/admin/view/javascript/codecart-quick-price-edit.js"
            "upload/admin/controller/extension/theme/codecart.php"
            "upload/admin/view/template/extension/theme/codecart.twig"
            "upload/admin/language/en-gb/extension/theme/codecart.php"
            "upload/admin/language/ru-ru/extension/theme/codecart.php"
            "upload/admin/language/uk-ua/extension/theme/codecart.php"
            "upload/catalog/model/tool/image.php"
            "upload/catalog/controller/product/product.php"
            "upload/catalog/view/theme/codecart/template/product/product.twig"
            "upload/catalog/view/theme/codecart/stylesheet/stylesheet.css"
            "upload/admin/controller/setting/setting.php"
            "upload/admin/view/template/setting/setting.twig"
            "upload/admin/language/en-gb/setting/setting.php"
            "upload/admin/language/ru-ru/setting/setting.php"
            "upload/admin/language/uk-ua/setting/setting.php"
            "upload/admin/language/en-gb/catalog/product.php"
            "upload/admin/language/ru-ru/catalog/product.php"
            "upload/admin/language/uk-ua/catalog/product.php"
            "upload/system/library/codecart/src/Scheduler.php"
          )
          for file in "${files[@]}"; do test -f "$file"; done
          php -l "upload/admin/controller/catalog/product.php"
          php -l "upload/admin/model/catalog/product.php"
          php -l "upload/admin/controller/extension/theme/codecart.php"
          php -l "upload/admin/language/en-gb/extension/theme/codecart.php"
          php -l "upload/admin/language/ru-ru/extension/theme/codecart.php"
          php -l "upload/admin/language/uk-ua/extension/theme/codecart.php"
          php -l "upload/catalog/model/tool/image.php"
          php -l "upload/catalog/controller/product/product.php"
          php -l "upload/admin/controller/setting/setting.php"
          php -l "upload/admin/language/en-gb/setting/setting.php"
          php -l "upload/admin/language/ru-ru/setting/setting.php"
          php -l "upload/admin/language/uk-ua/setting/setting.php"
          php -l "upload/admin/language/en-gb/catalog/product.php"
          php -l "upload/admin/language/ru-ru/catalog/product.php"
          php -l "upload/admin/language/uk-ua/catalog/product.php"
          php -l "upload/system/library/codecart/src/Scheduler.php"
          node --check upload/admin/view/javascript/codecart-quick-price-edit.js
          php -r '$regex = "/^(?:0|[1-9][0-9]{0,10})(?:\\.[0-9]{1,4})?$/"; foreach (["0","2","120.45"] as $v) { if (!preg_match($regex,$v)) exit(2); } foreach (["-1","2.55555","nan"] as $v) { if (preg_match($regex,$v)) exit(3); }'
          python3 - <<'PY'
          from pathlib import Path
          def read(name):
              return Path(name).read_text(encoding="utf-8")
          product=read("upload/admin/controller/catalog/product.php")
          model=read("upload/admin/model/catalog/product.php")
          view=read("upload/admin/view/template/catalog/product_list.twig")
          js=read("upload/admin/view/javascript/codecart-quick-price-edit.js")
          css=read("upload/admin/view/stylesheet/codecart_product_list.css")
          scheduler=read("upload/system/library/codecart/src/Scheduler.php")
          theme=read("upload/admin/controller/extension/theme/codecart.php")
          image=read("upload/catalog/model/tool/image.php")
          gallery=read("upload/catalog/view/theme/codecart/template/product/product.twig")
          gallery_css=read("upload/catalog/view/theme/codecart/stylesheet/stylesheet.css")
          assert "searchDistinctSkus(" in model and "GROUP BY TRIM(p.sku)" in model
          assert "catalog/product/skuAutocomplete" in view and "request.length < 2" in view
          assert "quickProductField()" in product and "getQuickProductFields" in model
          assert "saveQuickProductField" in model
          assert "array('price' => true, 'quantity' => true, 'status' => true, 'noindex' => true)" in product
          assert "hash_equals($expected_token, $token)" in product
          assert "hasPermission('modify', 'catalog/product')" in product
          assert "error_quick_field_conflict" in product
          assert 'data-field="noindex"' in view and 'data-field="status"' in view
          assert "data-quantity" in view
          assert "field: field" in js and "aria-pressed" in js
          assert "ccp-qpf-toggle" in css
          assert "ccp-qpe-quantity-cell" in css
          assert "core.stock.notify" in scheduler and "cron/stock_notify" in scheduler
          assert "core.queue.worker" in scheduler and "cron/queue_worker" in scheduler
          assert "core.mail.campaign" in scheduler and "cron/mail_campaign" in scheduler
          assert "route = 'cron'" in scheduler
          assert "background' ? 'white'" in theme
          assert "resizeContain($filename, $width, $height, $max_scale = 0)" in image
          assert "'upscale' && $value === '' ? '1'" in image
          assert "product_gallery_background|default('white')" in gallery
          assert "image_thumb_width > 0" in gallery
          assert "image_thumb_height > 0" in gallery
          assert "width: auto !important" in gallery_css and "object-fit: contain !important" in gallery_css
          assert "var(--ccp-gallery-aspect" in gallery_css
          assert "naturalWidth" not in gallery
          for locale in ("en-gb", "ru-ru", "uk-ua"):
              labels=read(f"upload/admin/language/{locale}/catalog/product.php")
              assert "text_quick_index_tooltip" in labels and "error_quick_quantity_value" in labels
              assert "entry_codecart_quick_price_edit" in read(f"upload/admin/language/{locale}/setting/setting.php")
              assert "help_codecart_quick_price_edit" in read(f"upload/admin/language/{locale}/setting/setting.php")
          print("Static regression checks: PASS")
          PY
          cat > README-CHANGES.txt <<'README'
          CodeCart 3.0.6 — catalog, gallery and Cron fixes.
          Contains 23 complete modified files, with original upload/ paths.
          Backup the COMPLETE site and database before copying any files!
          Patch applies only to a matching CodeCart 3.0.6 build.
          Upload, clear Twig cache and image derivatives as necessary, refresh OCMOD.

          CATALOG PRODUCTS:
          - Unique SKU hints (at least 2 characters), aligned clear buttons.
          - Price and stock quantity edit without full product form.
          - Clickable on/off switches for visibility and search indexing.
            Indexing ON means noindex=0; Indexing OFF means noindex=1.
          - Changes require CSRF session token, modify rights, field validation,
            and optimistic concurrency checks. Failed saves keep old values.
          - Disable all inline edits via Store Settings > Options > Products >
            Quick product editing (single switch for all four fields).
            Old Quick Price Edit OCMOD should be disabled to avoid duplicates.

          PHOTO GALLERY:
          - CSS background affects FRAME ONLY. Default white; None selectable.
          - The source photo is never overwritten or padded with a white raster.
          - The main frame is fixed to theme thumb WIDTH x HEIGHT; additional
            thumbnails use theme additional image dimensions.
          - Proportional Contain takes the smaller of width and height ratios,
            preserving the entire image without cropping or distortion.
          - In fit mode the default maximum enlargement is 1x (original pixels).
            Explicit gallery upscale choices override this.
          - OpenCart native mode is still available for compatibility.
          - The source photo may itself contain a white background. CSS cannot
            remove such pixels.

          SCHEDULER:
          - Self-heal only legacy core tasks with erroneous bare route "cron":
            stock notifications, queue worker, and mail campaigns.
          - Custom task routes are NEVER guessed or modified.
          - Live cron execution and web server setup must be verified separately.

          This is a changed-files patch, not a full shop installation.
          README
          zip -q CodeCart_3.0.6_Gallery_Cron_Quick_Edit.zip "${files[@]}" README-CHANGES.txt
          unzip -t CodeCart_3.0.6_Gallery_Cron_Quick_Edit.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodeCart_3.0.6_Gallery_Cron_Quick_Edit
          path: CodeCart_3.0.6_Gallery_Cron_Quick_Edit.zip
          if-no-files-found: error
          retention-days: 30

      - name: Archive the complete main-branch source tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=CodeCart_3.0.6_Full_Main.zip HEAD
          unzip -tq CodeCart_3.0.6_Full_Main.zip
          for required in upload/index.php upload/admin/index.php upload/system/engine/action.php upload/catalog/controller/product/product.php upload/admin/controller/catalog/product.php; do
            unzip -Z -1 CodeCart_3.0.6_Full_Main.zip | grep -Fxq "$required"
          done
          echo "Git revision: $(git rev-parse HEAD)"
          echo "Tracked source files: $(git ls-files | wc -l)"
          echo "Archived entries: $(unzip -Z -1 CodeCart_3.0.6_Full_Main.zip | wc -l)"
          sha256sum CodeCart_3.0.6_Full_Main.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CodeCart_3.0.6_Full_Main
          path: CodeCart_3.0.6_Full_Main.zip
          if-no-files-found: error
          retention-days: 30
