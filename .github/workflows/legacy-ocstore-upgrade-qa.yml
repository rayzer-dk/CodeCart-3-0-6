name: Legacy ocStore 3.x Upgrade Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'upload/system/library/cart/user.php'
      - 'upload/system/library/codecart/src/LoginProtection.php'
      - 'upload/system/helper/general.php'
      - 'upload/catalog/controller/product/category.php'
      - 'upload/catalog/view/theme/codecart/template/product/category.twig'
      - 'upload/catalog/view/theme/default/template/product/category.twig'
      - 'tests/legacy_upgrade_auth_and_category_smoke.php'
      - '.github/workflows/legacy-ocstore-upgrade-qa.yml'
  pull_request:
    paths:
      - 'upload/system/library/cart/user.php'
      - 'upload/system/library/codecart/src/LoginProtection.php'
      - 'upload/catalog/view/theme/**/template/product/category.twig'
      - 'tests/legacy_upgrade_auth_and_category_smoke.php'
      - '.github/workflows/legacy-ocstore-upgrade-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-upgrade:
    name: ocStore upgrade / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l upload/system/library/cart/user.php
          php -l upload/system/library/codecart/src/LoginProtection.php
          php -l upload/catalog/controller/product/category.php
          php -l tests/legacy_upgrade_auth_and_category_smoke.php
      - name: Regressions on legacy admin login and category images
        run: php tests/legacy_upgrade_auth_and_category_smoke.php
